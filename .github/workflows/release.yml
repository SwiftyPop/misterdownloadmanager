# Builds the downloads: Linux (build-linux.sh: AppImage, tar.gz, .deb, .rpm).
# Streamlined for Linux-only fast builds with automatic pre-release publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  geo:
    # Where a download's server is (#140): this month's IP-to-country table (DB-IP's IP to Country
    # Lite, CC BY 4.0) for every build. A failed download keeps the committed one, with a warning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: IP-to-country table
        run: python3 tools/geo/build.py --release

      - uses: actions/upload-artifact@v4
        with:
          name: geo-data
          path: crates/geo/data/*
          retention-days: 7

  linux:
    # The oldest supported Ubuntu: the programs run on its glibc (2.35) and newer.
    needs: geo
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: geo-data
          path: crates/geo/data

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-cargo-

      - name: Libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev rpm python3-pil zsync

      - name: AppImage, tar.gz, .deb, .rpm
        run: bash tools/installer/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*

      - name: Publish AppImage for Shelly
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dev-${{ github.run_number }}"
          name: "Experimental Build #${{ github.run_number }}"
          prerelease: true
          files: target/dist/*.AppImage
